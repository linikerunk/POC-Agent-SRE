# Copie para backend-secret.yaml, preencha o valor real e NÃO commite esse arquivo.
# Alternativa recomendada: crie o secret via CLI em vez de aplicar um arquivo com o valor em texto puro:
#   kubectl create secret generic backend-secret --from-literal=OPENAI_API_KEY=<sua-chave>
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  OPENAI_API_KEY: "<preencher>"
